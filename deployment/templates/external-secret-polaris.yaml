{{- if and .Values.api.enabled .Values.api.polaris.enabled }}
# Ingest-URL's van Polaris Security, apart van backend-secret: ontbreken ze
# nog in Vault, dan faalt alleen deze ExternalSecret en start de backend
# gewoon (zonder Polaris).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.api.polaris.secretName }}
spec:
  refreshInterval: "120s"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: {{ .Values.api.polaris.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: POLARIS_ALERT_INGEST_URL
      remoteRef:
        key: kv/puntenteller
        property: POLARIS_ALERT_INGEST_URL
    - secretKey: POLARIS_ASSET_INGEST_URL
      remoteRef:
        key: kv/puntenteller
        property: POLARIS_ASSET_INGEST_URL
{{- end }}
