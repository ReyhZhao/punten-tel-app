{{- if and .Values.api.enabled .Values.api.push.keyId }}
# APNs-sleutel (.p8) voor pushmeldingen, apart van backend-secret: ontbreekt
# hij nog in Vault, dan faalt alleen deze ExternalSecret en start de backend
# gewoon (zonder push).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.api.push.secretName }}
spec:
  refreshInterval: "120s"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: {{ .Values.api.push.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: APNS_PRIVATE_KEY
      remoteRef:
        key: kv/puntenteller
        property: APNS_PRIVATE_KEY
{{- end }}
