apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: punten-tel
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    # Uncomment if using cert-manager for TLS:
    # cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: bunkerweb
  tls:
    - hosts:
        - {{ .Values.host }}
      #secretName: punten-tel-tls    # <-- cert-manager will create this, or supply manually
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          {{- if .Values.api.enabled }}
          # Backend op hetzelfde domein; de langste prefix wint van "/".
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: punten-api
                port:
                  name: http
          - path: /admin/
            pathType: Prefix
            backend:
              service:
                name: punten-api
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: punten-tel
                port:
                  name: http
