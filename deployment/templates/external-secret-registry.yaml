---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: registry-pull
spec:
  refreshInterval: "120s"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: registry-pull
    creationPolicy: Owner
    # Inloggegevens voor registry.vels.online (htpasswd-auth), gebruikt via
    # imagePullSecrets. De binnenste template rendert external-secrets, niet
    # Helm; vandaar de backticks.
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ `'{"auths":{"registry.vels.online":{"auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'` }}
  data:
    - secretKey: username
      remoteRef:
        key: kv/puntenteller
        property: REGISTRY_USERNAME
    - secretKey: password
      remoteRef:
        key: kv/puntenteller
        property: REGISTRY_PASSWORD
