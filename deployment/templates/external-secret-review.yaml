{{- if and .Values.api.enabled .Values.api.review.email }}
# Vaste inlogcode voor het review-account van Apple (Vault: REVIEW_ACCOUNT_CODE).
# Apart, zodat een ontbrekende waarde alleen deze ExternalSecret raakt.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.api.review.secretName }}
spec:
  refreshInterval: "120s"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: {{ .Values.api.review.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: REVIEW_ACCOUNT_CODE
      remoteRef:
        key: kv/puntenteller
        property: REVIEW_ACCOUNT_CODE
{{- end }}
