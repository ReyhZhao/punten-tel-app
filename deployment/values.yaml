image:
  repository: registry.vels.online/punten/app
  tag: v1.8.0
  pullPolicy: Always
# Eén domein voor de PWA (/) en de backend (/api/, /admin/).
host: punten.vels.online
# BunkerWeb-instellingen voor dit domein (docs/research/sse-realtime-updates.md).
ingress:
  annotations:
    # Realtime-stream (/api/v1/events, Server-Sent Events) niet bufferen.
    bunkerweb.io/REVERSE_PROXY_BUFFERING: "no"
    # 400/401/404/429 zijn bij de API normale antwoorden (verkeerde inlogcode,
    # onbekend e-mailadres, verlopen token, throttle). Niet als "slecht gedrag"
    # tellen: spelers aan tafel delen vaak één IP. De API heeft eigen limieten.
    bunkerweb.io/BAD_BEHAVIOR_STATUS_CODES: "403 405 444"
# Backend (Django). De image-tag wordt bijgewerkt door de release-workflow
# bij een tag `api-vX.Y.Z`.
api:
  enabled: true
  image:
    repository: registry.vels.online/punten/api
    tag: v0.6.0
    pullPolicy: Always
  # Eén replica: de migraties draaien als initContainer en mogen niet dubbel
  # draaien. De rate limiting gebruikt een cache in PostgreSQL en werkt dus wel
  # over workers en replicas heen, zie backend/README.md ("Opschalen").
  replicas: 1
  # Secret met DJANGO_SECRET_KEY en EMAIL_HOST_PASSWORD, aangemaakt door de
  # ExternalSecret (templates/external-secret.yaml) uit Vault (kv/puntenteller).
  # Het databasewachtwoord komt uit de Secret van CloudNativePG.
  existingSecret: backend-secret
  email:
    host: "mail.vels.online"
    port: "587"
    user: "puntenteller@vels.online"
    useTls: "true"
    from: "Puntenteller <puntenteller@vels.online>"
  # Pushmeldingen (Apple Push Notification service). Leeg keyId = push uit.
  # De .p8-sleutel staat in Vault (kv/puntenteller, property APNS_PRIVATE_KEY).
  push:
    keyId: "AD36223QJ3"
    teamId: "W38CK4LB5F"
    topic: "online.vels.puntenteller"
    secretName: backend-apns-secret
  # Account voor Apple's app-review: vaste inlogcode uit Vault
  # (kv/puntenteller, property REVIEW_ACCOUNT_CODE), er wordt niets gemaild.
  # Leeg = uit.
  review:
    email: "apple@vels.online"
    secretName: backend-review-secret
  # Beveiligingsmeldingen naar Polaris Security (SOC), zie POLARIS_INTEGRATION.md.
  # De ingest-URL's zijn geheim en staan in Vault (kv/puntenteller, properties
  # POLARIS_ALERT_INGEST_URL en POLARIS_ASSET_INGEST_URL). false = uit.
  polaris:
    enabled: true
    environment: "production"
    secretName: backend-polaris-secret
    # Krijgt een mail als Polaris de ingest-URL weigert of een half uur
    # onbereikbaar is: de SOC merkt dan zelf niet dat er niets binnenkomt.
    opsEmail: "eddie@vels.online"
# PostgreSQL via CloudNativePG (de operator moet in het cluster draaien).
# De backend leest host, poort, database, gebruiker en wachtwoord uit de
# Secret "<clusterName>-app" die CNPG aanmaakt.
postgres:
  # true = deze chart maakt het CNPG-cluster aan. false = gebruik een
  # bestaand CNPG-cluster met deze naam in dezelfde namespace.
  createCluster: true
  clusterName: punten-db
  instances: 1
  database: puntenteller
  owner: puntenteller
  storage: 5Gi
  # Leeg = de standaard StorageClass van het cluster.
  storageClassName: ""
  # Leeg = de standaard-image van de operator.
  imageName: ""
